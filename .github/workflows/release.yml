name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - name: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: ytm-cli
            archive: ytm-cli-linux-x86_64.tar.gz
          - name: macos
            os: macos-latest
            target: x86_64-apple-darwin
            bin: ytm-cli
            archive: ytm-cli-macos-x86_64.tar.gz
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: ytm-cli.exe
            archive: ytm-cli-windows-x86_64.zip

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux ALSA)
        if: matrix.platform.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.platform.target }} --locked

      - name: Package archive (Unix)
        if: matrix.platform.name != 'windows'
        run: |
          cd target/${{ matrix.platform.target }}/release
          tar -czf ../../../${{ matrix.platform.archive }} ${{ matrix.platform.bin }}

      - name: Package archive (Windows)
        if: matrix.platform.name == 'windows'
        shell: pwsh
        run: |
          cd target\${{ matrix.platform.target }}\release
          Compress-Archive -Path ${{ matrix.platform.bin }} -DestinationPath ..\..\..\${{ matrix.platform.archive }}

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.platform.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
